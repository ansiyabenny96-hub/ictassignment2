<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtVista | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6">
          <div class="auth-card p-4 p-md-5 rounded-4">
            <div class="text-center mb-4">
              <span class="hero-badge badge rounded-pill bg-light text-dark px-3 py-2">Join ArtVista</span>
              <h1 class="mt-3 hero-title fw-bold">Create Your Account</h1>
              <p class="text-light-emphasis">Start collecting inspiration from the finest creative voices.</p>
            </div>
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control" placeholder="Ava" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control" placeholder="Martinez" />
                </div>
              </div>
              <div class="mt-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" placeholder="you@example.com" />
              </div>
              <div class="mt-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Choose a secure password" />
              </div>
              <button class="btn btn-primary w-100 py-2 mt-4">Create Account</button>
            </form>
            <div class="text-center mt-3">
              <a href="index.html" class="text-decoration-none text-info">Already have an account?</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
