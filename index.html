<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtVista | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-5">
          <div class="auth-card p-4 p-md-5 rounded-4">
            <div class="text-center mb-4">
              <span class="hero-badge badge rounded-pill bg-light text-dark px-3 py-2">ArtVista</span>
              <h1 class="mt-3 hero-title fw-bold">Welcome Back</h1>
              <p class="text-light-emphasis">Sign in to explore curated contemporary art.</p>
            </div>
            <form action="home.html">
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" placeholder="you@example.com" />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter password" />
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
            <div class="text-center mt-3">
              <a href="signup.html" class="text-decoration-none text-info">Create a new account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
